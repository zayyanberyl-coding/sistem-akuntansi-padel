<!-- Logo Smash Padel Club: raket padel + bola yang baru di-"smash" -->
<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Lencana hijau tua -->
  <rect width="48" height="48" rx="13" fill="#14614f"/>

  <!-- Raket padel (miring), lengkap dengan lubang-lubang khas raket padel -->
  <g transform="translate(3 -1.5) rotate(-35 24 24)">
    <path d="M24 6.5c6.8 0 11.2 4.8 11.2 11 0 5.3-3.3 9.2-7.6 10.8L26.6 32h-5.2l-1-3.7C16.1 26.7 12.8 22.8 12.8 17.5 12.8 11.3 17.2 6.5 24 6.5z" fill="#fff"/>
    <g fill="#14614f">
      <circle cx="20" cy="12.5" r="1.2"/><circle cx="24" cy="11.5" r="1.2"/><circle cx="28" cy="12.5" r="1.2"/>
      <circle cx="18" cy="16.5" r="1.2"/><circle cx="22" cy="16" r="1.2"/><circle cx="26" cy="16" r="1.2"/><circle cx="30" cy="16.5" r="1.2"/>
      <circle cx="20" cy="20.5" r="1.2"/><circle cx="24" cy="20" r="1.2"/><circle cx="28" cy="20.5" r="1.2"/>
      <circle cx="22" cy="24" r="1.2"/><circle cx="26" cy="24" r="1.2"/>
    </g>
    <!-- Gagang (grip) warna lime -->
    <rect x="22.1" y="31.5" width="3.8" height="9.5" rx="1.9" fill="#c6f432"/>
  </g>

  <!-- Garis gerak: bola melesat ke bawah setelah di-smash -->
  <g stroke="#c6f432" stroke-linecap="round" fill="none">
    <path d="M15.8 33.6l4.6-3.4" stroke-width="1.7" opacity=".85"/>
    <path d="M13.2 30.6l3.2-2.4" stroke-width="1.4" opacity=".55"/>
  </g>

  <!-- Bola padel -->
  <circle cx="11.8" cy="37" r="4.3" fill="#c6f432"/>
  <path d="M8.6 35.2c2.3.4 4.6 2.2 5.6 4.9" fill="none" stroke="#14614f" stroke-width=".9" stroke-linecap="round"/>
</svg>
